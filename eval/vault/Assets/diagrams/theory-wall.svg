<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="system-ui, sans-serif" font-size="12" fill="none" stroke="#8a919c" stroke-width="1.5">
  <title>The theory wall in the Case Command room: six cards, one official, strings to the evidence</title>
  <rect x="20" y="20" width="600" height="200" rx="4"/>
  <g stroke="#d08a3c"><rect x="250" y="40" width="140" height="50" rx="3"/></g>
  <rect x="40" y="40" width="140" height="50" rx="3"/><rect x="460" y="40" width="140" height="50" rx="3"/>
  <rect x="40" y="150" width="140" height="50" rx="3"/><rect x="250" y="150" width="140" height="50" rx="3"/><rect x="460" y="150" width="140" height="50" rx="3"/>
  <circle cx="320" cy="125" r="18" stroke="#4f9fb8"/>
  <g stroke="#4f9fb8" stroke-dasharray="3 3"><path d="M180 65 L 304 118"/><path d="M460 65 L 336 118"/><path d="M110 150 L 304 132"/><path d="M320 150 V 143"/><path d="M530 150 L 336 132"/><path d="M320 90 V 107"/></g>
  <g fill="#8a919c" stroke="none" text-anchor="middle" font-size="11">
    <text x="320" y="62" fill="#d08a3c">Firmware 7</text><text x="320" y="78" fill="#d08a3c">official</text>
    <text x="110" y="62">The future</text><text x="110" y="78">is answering</text>
    <text x="530" y="62">The dish</text><text x="530" y="78">is alive</text>
    <text x="110" y="172">A weapons test,</text><text x="110" y="188">covered up</text>
    <text x="320" y="172">The relay mind</text><text x="320" y="188">is lying</text>
    <text x="530" y="172">The hollow-moon</text><text x="530" y="188">lighthouse</text>
    <text x="320" y="129" fill="#4f9fb8">0.71 s</text>
  </g>
</svg>
