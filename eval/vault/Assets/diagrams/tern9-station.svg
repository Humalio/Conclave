<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="12" fill="none" stroke="#8a919c" stroke-width="1.5">
  <title>Relay Tern-9, side section: main reflector, ring of twelve feed petals, cold receiver face, dish house and keepers' bunks</title>
  <path d="M60 230 Q 200 40 340 230" />
  <path d="M200 140 V 230" stroke-dasharray="4 4"/>
  <g stroke="#d08a3c"><rect x="80" y="196" width="22" height="10" rx="3"/><rect x="298" y="196" width="22" height="10" rx="3"/><rect x="120" y="140" width="22" height="10" rx="3"/><rect x="258" y="140" width="22" height="10" rx="3"/></g>
  <rect x="186" y="150" width="28" height="12" rx="2" stroke="#4f9fb8"/>
  <rect x="380" y="150" width="120" height="80" rx="6"/><rect x="520" y="150" width="100" height="80" rx="6"/>
