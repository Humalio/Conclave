<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="'Segoe Print', 'Bradley Hand', cursive, sans-serif" font-size="13" fill="none" stroke="#8a919c" stroke-width="1.4" stroke-linecap="round">
  <title>Frost specimen F-3 under the cold microscope, sketch by Linnea (Xenobiology), 11 Apr 2191</title>
  <circle cx="160" cy="150" r="128"/>
  <g stroke="#4f9fb8">
    <path d="M70 200 C 110 170, 130 150, 165 145 S 230 120, 255 80"/>
    <path d="M90 95 C 120 115, 140 135, 165 145 S 210 190, 250 215"/>
    <path d="M165 145 C 160 180, 150 215, 140 250"/>
  </g>
  <g fill="#4f9fb8" stroke="none">
    <circle cx="165" cy="145" r="5"/>
    <circle cx="110" cy="174" r="2.5"/><circle cx="210" cy="125" r="2.5"/><circle cx="125" cy="117" r="2.5"/><circle cx="212" cy="185" r="2.5"/><circle cx="152" cy="212" r="2.5"/>
