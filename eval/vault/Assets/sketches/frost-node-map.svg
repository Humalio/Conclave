<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="'Segoe Print', 'Bradley Hand', cursive, sans-serif" font-size="13" fill="none" stroke="#8a919c" stroke-width="1.4" stroke-linecap="round">
  <title>Bay 2 receiver face: nine frost positions (after IR-0412) overlaid with the nine ring nodes of CAP-014b (bay 3)</title>
  <rect x="40" y="40" width="300" height="220" rx="10"/>
  <circle cx="190" cy="150" r="10" stroke-dasharray="3 3"/>
  <g stroke="#4f9fb8">
    <circle cx="80" cy="80" r="7"/><circle cx="160" cy="80" r="7"/><circle cx="240" cy="80" r="7"/>
    <circle cx="80" cy="150" r="7"/><circle cx="240" cy="150" r="7"/><circle cx="300" cy="150" r="7"/>
    <circle cx="80" cy="220" r="7"/><circle cx="160" cy="220" r="7"/><circle cx="300" cy="220" r="7"/>
  </g>
  <g fill="#d08a3c" stroke="none">
    <circle cx="81" cy="81" r="2.5"/><circle cx="161" cy="79" r="2.5"/><circle cx="239" cy="81" r="2.5"/>
    <circle cx="80" cy="151" r="2.5"/><circle cx="241" cy="150" r="2.5"/><circle cx="299" cy="151" r="2.5"/>
    <circle cx="81" cy="219" r="2.5"/><circle cx="160" cy="221" r="2.5"/><circle cx="300" cy="219" r="2.5"/>
  </g>
  <g fill="#8a919c" stroke="none" font-size="11">
    <text x="360" y="70" fill="#4f9fb8">○ frost, bay 2</text>
    <text x="360" y="90" fill="#d08a3c">● ring node, bay 3</text>
    <text x="360" y="140">feed throat:</text><text x="360" y="156">nothing there</text>
    <text x="40" y="285">nine and nine, within 0.4 mm. bay 3 never had frost. — B.A.</text>
  </g>
  <path d="M356 146 L 202 150" stroke-dasharray="2 4"/>
</svg>
