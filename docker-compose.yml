# Agent Hub. Run `deploy/setup.sh` to create .env, or copy .env.example and fill it in.
# With HTTPS enabled, .env sets COMPOSE_FILE so deploy/docker-compose.https.yml is layered on top.
services:
  agent-hub:
    build: .
    # Run as the host user that owns ./data and the vault, so bind mounts are writable.
    user: "${HUB_UID:-1000}:${HUB_GID:-1000}"
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - ./data:/data
      - ${VAULT_HOST_DIR:?set VAULT_HOST_DIR in .env}:/vault
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
